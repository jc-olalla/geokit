[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geokit"
version = "0.1.0"
description = "Python toolbox for geospatial data processing and visualization"
requires-python = ">=3.12"
dependencies = [
    "geopandas",
    "requests",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
